<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Hub</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b132b; color: #f8fafc; margin: 0; padding: 0; }
    header { text-align: center; padding: 30px 15px; user-select: none; }
    .logo-icon { background: #1c2541; width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s; }
    .logo-icon:hover { transform: scale(1.05); }
    .logo-icon svg { width: 35px; height: 35px; fill: #38bdf8; }
    header h1 { font-size: 1.8rem; margin: 5px 0; color: #fff; }
    .folder-icons { font-size: 1.2rem; margin-top: 5px; }
    
    .container { max-width: 900px; margin: 0 auto; padding: 0 15px 30px 15px; }
    
    /* Tabs Navigation */
    .tabs-bar { display: flex; background: #1c2541; padding: 8px; border-radius: 14px; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .tab-btn { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; }
    .tab-btn.secret-tab { background: #450a0a; color: #fca5a5; border: 1px dashed #f43f5e; }
    .tab-btn.secret-tab.active { background: #dc2626; color: #fff; }
    .tab-badge { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; }

    /* Search Bar */
    .search-box { position: relative; margin-bottom: 25px; }
    .search-box input { width: 100%; padding: 14px 14px 14px 45px; background: #1c2541; border: 1px solid #334155; border-radius: 14px; color: #fff; font-size: 1rem; box-sizing: border-box; outline: none; }
    .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: #94a3b8; }

    /* Section Header */
    .section-title { font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #f8fafc; }

    /* Grid Items */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .item-card { background: #1c2541; border-radius: 16px; overflow: hidden; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .item-card img, .item-card video { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; cursor: pointer; background: #000; }
    .item-title { font-size: 0.9rem; margin: 10px 0; color: #cbd5e1; word-break: break-all; }
    
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.85rem; text-decoration: none; }
    .btn-view { background: #334155; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }

    /* Modal & Fullscreen Viewer */
    .hidden { display: none !important; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1c2541; padding: 30px; border-radius: 16px; text-align: center; width: 300px; }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0b132b; color: #fff; box-sizing: border-box; }
    .modal-content button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .error { color: #ef4444; font-size: 0.85rem; margin-top: 5px; }

    /* Media Viewer Modal */
    .media-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; padding: 20px; box-sizing: border-box; }
    .media-modal-content { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
    .close-media-btn { margin-top: 20px; padding: 10px 25px; background: #ef4444; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }

    .admin-card { border: 2px dashed #0284c7; background: #161f38; padding: 20px; border-radius: 16px; margin-bottom: 25px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-icon" id="cloud-trigger" title="Tap 5 times">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zM8 13h2.55v3h2.9v-3H16l-4-4-4 4z"/></svg>
    </div>
    <h1>Storage Hub</h1>
    <div class="folder-icons">📂📁🗂️</div>
  </header>

  <main class="container">
    
    <!-- Admin Upload Panel -->
    <div id="admin-panel" class="admin-card hidden">
      <h2 style="color: #38bdf8; margin-top: 0;">🛠️ Admin Upload Panel</h2>
      <input type="text" id="up-title" placeholder="File Title" value="">
      <select id="up-type">
        <option value="photo">Photos</option>
        <option value="video">Videos</option>
        <option value="app">Apps</option>
        <option value="other">Others / Docs</option>
      </select>
      <input type="text" id="up-url" placeholder="File URL (Google Drive Direct Download Link)" value="">
      <label style="display: block; margin: 10px 0; text-align: left; font-size: 0.9rem;">
        <input type="checkbox" id="up-is-secret" style="width: auto;"> 18+ Secret Content ဖြစ်ပါသလား?
      </label>
      <button onclick="uploadData()" style="background: #10b981;">Upload to Server</button>
      <button onclick="hideAdmin()" style="background: #ef4444; margin-top: 8px;">Close Admin Panel</button>
    </div>

    <!-- Tabs Bar -->
    <div class="tabs-bar" id="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('photo', this)">
        🖼️ Photos <span class="tab-badge" id="count-photo">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('video', this)">
        🎬 Videos <span class="tab-badge" id="count-video">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('app', this)">
        📱 Apps <span class="tab-badge" id="count-app">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('other', this)">
        📁 Others <span class="tab-badge" id="count-other">0</span>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-input" placeholder="ဖိုင်နာမည်ရှာရန်..." value="" oninput="filterItems()">
    </div>

    <!-- Section Header -->
    <div class="section-title">
      <span id="section-icon">🖼️</span> <span id="section-name">Photos Collection</span>
    </div>
    
    <div id="content-grid" class="grid">
      <p style="color: #94a3b8; text-align: center; grid-column: 1/-1;">Loading...</p>
    </div>

  </main>

  <!-- Password Modal -->
  <div id="pass-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-top:0;">🔒 Enter Passcode</h3>
      <input type="password" id="pass-input" placeholder="Passcode" value="">
      <button onclick="verifyPassword()">Confirm</button>
      <button onclick="closeModal()" style="background: #334155; margin-top: 8px;">Cancel</button>
      <p id="pass-error" class="error"></p>
    </div>
  </div>

  <!-- Media Fullscreen Viewer Modal -->
  <div id="media-modal" class="media-modal hidden">
    <div id="media-container" style="display:flex; justify-content:center; align-items:center; width:100%; height:80vh;"></div>
    <button class="close-media-btn" onclick="closeMediaModal()">❌ ပြန်ထွက်မည် (Close)</button>
  </div>

  <script>
    // ======= CONFIGURATION =======
    const API_URL = "https://script.google.com/macros/s/AKfycbygD6ifijzHpptfSbsg8oHASQpq_yZ0QMMUcGII4fH60oBKhHjI-j2KzjC5lRuyD7TWBg/exec"; // <-- သင့် Apps Script URL ထည့်ရန်
    const VAULT_PASS = "1994"; // 18+ Vault Password
    const ADMIN_PASS = "5021"; // Admin Upload Password
    // =============================

    let allItems = [];
    let currentTab = 'photo';
    let isSecretUnlocked = false;
    let currentMode = '';
    
    let cloudClicks = 0;
    let cloudTimer = null;

    const passModal = document.getElementById('pass-modal');
    const modalTitle = document.getElementById('modal-title');
    const passInput = document.getElementById('pass-input');
    const passError = document.getElementById('pass-error');
    const adminPanel = document.getElementById('admin-panel');
    const cloudTrigger = document.getElementById('cloud-trigger');
    const tabsBar = document.getElementById('tabs-bar');
    const mediaModal = document.getElementById('media-modal');
    const mediaContainer = document.getElementById('media-container');

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('search-input').value = '';
      if (window.location.hash === '#admin') {
        currentMode = 'admin';
        modalTitle.innerText = "🛠️ Admin Authentication";
        openModal();
      }
      loadAllData();
    });

    cloudTrigger.addEventListener('click', () => {
      if (isSecretUnlocked) {
        let secretBtn = document.getElementById('secret-tab-btn');
        if (secretBtn) switchTab('secret', secretBtn);
        return;
      }

      cloudClicks++;
      if (cloudClicks === 1) {
        cloudTimer = setTimeout(() => { cloudClicks = 0; }, 2000);
      }
      if (cloudClicks === 5) {
        clearTimeout(cloudTimer);
        cloudClicks = 0;
        currentMode = 'vault';
        modalTitle.innerText = "🔒 Unlock Secret Vault";
        openModal();
      }
    });

    function openModal() {
      passInput.value = '';
      passError.innerText = '';
      passModal.classList.remove('hidden');
      passInput.focus();
    }

    function closeModal() {
      passModal.classList.add('hidden');
      if (window.location.hash === '#admin') {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    function verifyPassword() {
      let pass = passInput.value.trim();
      if (currentMode === 'vault' && pass === VAULT_PASS) {
        closeModal();
        isSecretUnlocked = true;
        addSecretTab();
      } else if (currentMode === 'admin' && pass === ADMIN_PASS) {
        closeModal();
        adminPanel.classList.remove('hidden');
        adminPanel.scrollIntoView({ behavior: 'smooth' });
      } else {
        passError.innerText = "Incorrect Passcode!";
      }
    }

    function addSecretTab() {
      if (document.getElementById('secret-tab-btn')) return;
      let secretCount = allItems.filter(i => String(i.isSecret).toLowerCase() === 'true').length;

      let btn = document.createElement('button');
      btn.className = 'tab-btn secret-tab active';
      btn.id = 'secret-tab-btn';
      btn.innerHTML = `🔥 Secret <span class="tab-badge">${secretCount}</span>`;
      btn.onclick = function() { switchTab('secret', this); };

      tabsBar.appendChild(btn);
      switchTab('secret', btn);
    }

    function hideAdmin() {
      adminPanel.classList.add('hidden');
      history.pushState("", document.title, window.location.pathname + window.location.search);
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (tab === 'photo') {
        document.getElementById('section-icon').innerText = '🖼️';
        document.getElementById('section-name').innerText = 'Photos Collection';
      } else if (tab === 'video') {
        document.getElementById('section-icon').innerText = '🎬';
        document.getElementById('section-name').innerText = 'Videos Collection';
      } else if (tab === 'app') {
        document.getElementById('section-icon').innerText = '📱';
        document.getElementById('section-name').innerText = 'Applications';
      } else if (tab === 'other') {
        document.getElementById('section-icon').innerText = '📁';
        document.getElementById('section-name').innerText = 'Other Documents';
      } else if (tab === 'secret') {
        document.getElementById('section-icon').innerText = '🔥';
        document.getElementById('section-name').innerText = '18+ Secret Vault';
      }
      renderItems();
    }

    async function loadAllData() {
      try {
        let res = await fetch(API_URL);
        allItems = await res.json();
        updateCounts();
        renderItems();
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    function updateCounts() {
      let pCount = allItems.filter(i => i.type === 'photo' && String(i.isSecret).toLowerCase() !== 'true').length;
      let vCount = allItems.filter(i => i.type === 'video' && String(i.isSecret).toLowerCase() !== 'true').length;
      let aCount = allItems.filter(i => i.type === 'app' && String(i.isSecret).toLowerCase() !== 'true').length;
      let oCount = allItems.filter(i => i.type === 'other' && String(i.isSecret).toLowerCase() !== 'true').length;

      document.getElementById('count-photo').innerText = pCount;
      document.getElementById('count-video').innerText = vCount;
      document.getElementById('count-app').innerText = aCount;
      document.getElementById('count-other').innerText = oCount;

      let secretBtn = document.getElementById('secret-tab-btn');
      if (secretBtn) {
        let sCount = allItems.filter(i => String(i.isSecret).toLowerCase() === 'true').length;
        secretBtn.innerHTML = `🔥 Secret <span class="tab-badge">${sCount}</span>`;
      }
    }

    function getDownloadUrl(url) {
      if (url.includes('drive.google.com') && url.includes('/d/')) {
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
      }
      return url;
    }

    function renderItems() {
      let grid = document.getElementById('content-grid');
      grid.innerHTML = '';

      let keyword = document.getElementById('search-input').value.toLowerCase();
      let filtered = [];

      if (currentTab === 'secret') {
        filtered = allItems.filter(item => 
          String(item.isSecret).toLowerCase() === 'true' &&
          item.title.toLowerCase().includes(keyword)
        );
      } else {
        filtered = allItems.filter(item => 
          item.type === currentTab && 
          String(item.isSecret).toLowerCase() !== 'true' &&
          item.title.toLowerCase().includes(keyword)
        );
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: #94a3b8; text-align: center; grid-column: 1/-1;">ဖိုင်များ မရှိသေးပါ။</p>`;
        return;
      }

      filtered.forEach(item => {
        let card = document.createElement('div');
        card.className = 'item-card';
        let downloadLink = getDownloadUrl(item.url);

        if (item.type === 'photo' || currentTab === 'secret') {
          card.innerHTML = `
            <img src="${item.url}" alt="${item.title}" onclick="openMediaViewer('photo', '${item.url}')">
            <p class="item-title">${item.title}</p>
            <div class="card-actions">
              <button onclick="openMediaViewer('photo', '${item.url}')" class="action-btn btn-view">👁️ ကြည့်မည်</button>
              <a href="${downloadLink}" target="_blank" class="action-btn btn-download">⬇️ Download</a>
            </div>
          `;
        } else if (item.type === 'video') {
          card.innerHTML = `
            <video preload="metadata" onclick="openMediaViewer('video', '${item.url}')">
              <source src="${downloadLink}" type="video/mp4">
            </video>
            <p class="item-title">${item.title}</p>
            <div class="card-actions">
              <button onclick="openMediaViewer('video', '${item.url}')" class="action-btn btn-view">🎬 ဖွင့်ကြည့်မည်</button>
              <a href="${downloadLink}" target="_blank" class="action-btn btn-download">⬇️ Download</a>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div style="background:#0b132b; height:100px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:2rem;">📦</div>
            <p class="item-title"><b>${item.title}</b></p>
            <div class="card-actions">
              <a href="${downloadLink}" target="_blank" class="action-btn btn-download" style="width:100%;">⬇️ Download ဖိုင်ဆွဲမည်</a>
            </div>
          `;
        }
        grid.appendChild(card);
      });
    }

    function openMediaViewer(type, url) {
      mediaContainer.innerHTML = '';
      let directUrl = getDownloadUrl(url);
      if (type === 'photo') {
        mediaContainer.innerHTML = `<img src="${url}" class="media-modal-content">`;
      } else if (type === 'video') {
        mediaContainer.innerHTML = `<video src="${directUrl}" controls autoplay class="media-modal-content"></video>`;
      }
      mediaModal.classList.remove('hidden');
    }

    function closeMediaModal() {
      mediaContainer.innerHTML = '';
      mediaModal.classList.add('hidden');
    }

    function filterItems() {
      renderItems();
    }

    async function uploadData() {
      let title = document.getElementById('up-title').value.trim();
      let type = document.getElementById('up-type').value;
      let url = document.getElementById('up-url').value.trim();
      let isSecret = document.getElementById('up-is-secret').checked;

      if (!title || !url) {
        alert("ကျေးဇူးပြု၍ Title နှင့် URL ထည့်ပါ။");
        return;
      }

      let payload = { adminPass: ADMIN_PASS, title, type, url, isSecret };

      alert("Uploading... ခဏစောင့်ပါ။");
      try {
        let response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        let result = await response.json();
        if (result.status === "success") {
          alert("Upload အောင်မြင်ပါသည်။");
          document.getElementById('up-title').value = '';
          document.getElementById('up-url').value = '';
          document.getElementById('up-is-secret').checked = false;
          loadAllData();
        } else {
          alert("Upload မအောင်မြင်ပါ: " + result.message);
        }
      } catch (err) {
        alert("ချိတ်ဆက်မှု အမှားအယွင်း: " + err);
      }
    }
  </script>
</body>
</html>
